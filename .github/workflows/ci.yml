name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + intégration PostgreSQL/RustFS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: municipal_assistant
          POSTGRES_USER: municipal_app
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U municipal_app -d municipal_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
        env:
          RUSTFS_ACCESS_KEY: ci-rustfs-access
          RUSTFS_SECRET_KEY: ci-rustfs-secret-key
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      DATABASE_URL: postgresql+psycopg://municipal_app:ci-postgres-password@127.0.0.1:5432/municipal_assistant
      TEST_DATABASE_URL: postgresql+psycopg://municipal_app:ci-postgres-password@127.0.0.1:5432/municipal_assistant
      TEST_RUSTFS_ENDPOINT: http://127.0.0.1:9000
      TEST_RUSTFS_ACCESS_KEY: ci-rustfs-access
      TEST_RUSTFS_SECRET_KEY: ci-rustfs-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installer le backend
        run: pip install -e "./backend[dev]"
      - name: Appliquer les migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Exécuter les tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
