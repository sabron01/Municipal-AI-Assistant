name: municipal-ai-assistant

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-municipal_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-municipal_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  rustfs:
    image: rustfs/rustfs-x86-musl:v2.3.1
    container_name: maa-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-${MINIO_ROOT_USER:?Define RUSTFS_ACCESS_KEY in .env}}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Define RUSTFS_SECRET_KEY in .env}}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-${MINIO_API_PORT:-9000}}:9000"
      - "${RUSTFS_CONSOLE_PORT:-${MINIO_CONSOLE_PORT:-9001}}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [backend]

  ollama:
    image: ollama/ollama:latest
    container_name: maa-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [backend]

volumes:
  postgres_data:
  rustfs_data:
  ollama_data:

networks:
  backend:
    driver: bridge
